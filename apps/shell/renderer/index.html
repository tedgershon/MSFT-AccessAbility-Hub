<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>AccessAbility Hub</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#tile-grid">Skip to aids</a>

    <header class="app-header">
      <div class="app-header__brand">
        <span class="app-header__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#0067b8" />
            <circle cx="16" cy="9" r="2.6" fill="#ffffff" />
            <path
              d="M6.5 13.5c3 1.3 6.1 1.9 9.5 1.9s6.5-.6 9.5-1.9"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.4"
              stroke-linecap="round"
            />
            <path
              d="M16 12.5V19M16 19l-4 7.5M16 19l4 7.5"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <h1>AccessAbility Hub</h1>
      </div>

      <button
        id="customize-button"
        class="icon-button"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="customize-panel"
      >
        <span aria-hidden="true">Aa</span>
        <span class="visually-hidden">Customize your settings</span>
      </button>
    </header>

    <main class="app-body">
      <section
        id="onboarding"
        class="onboarding"
        aria-labelledby="onboarding-heading"
      >
        <h2 id="onboarding-heading" class="onboarding__heading">
          What do you want help with?
        </h2>
        <div class="onboarding__controls" role="search">
          <label class="field field--search">
            <span class="field__label visually-hidden">Search aids</span>
            <input
              id="search"
              type="search"
              class="field__input"
              placeholder="Search by need…"
              autocomplete="off"
              spellcheck="false"
            />
          </label>

          <label class="field field--filter">
            <span class="field__label visually-hidden">Filter by need</span>
            <select id="tag-filter" class="field__input"></select>
          </label>
        </div>
        <div id="active-filters" class="onboarding__active" aria-live="polite"></div>
      </section>

      <div id="customize-backdrop" class="modal-backdrop" hidden></div>
      <section
        id="customize-panel"
        class="customize-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="customize-heading"
        hidden
      >
        <div class="customize-panel__head">
          <h2 id="customize-heading">Customize your settings</h2>
          <button id="customize-done" class="customize-done" type="button">Done</button>
        </div>
        <div class="customize-grid">
          <fieldset class="customize-group">
            <legend>Text size</legend>
            <label><input type="radio" name="textSize" value="normal" /> Normal</label>
            <label><input type="radio" name="textSize" value="large" /> Large</label>
            <label><input type="radio" name="textSize" value="x-large" /> Extra large</label>
          </fieldset>

          <fieldset class="customize-group">
            <legend>Theme</legend>
            <label><input type="radio" name="theme" value="light" /> Light</label>
            <label><input type="radio" name="theme" value="dark" /> Dark</label>
            <label><input type="radio" name="theme" value="system" /> System</label>
          </fieldset>

          <fieldset class="customize-group">
            <legend>Contrast</legend>
            <label><input type="radio" name="contrast" value="standard" /> Standard</label>
            <label><input type="radio" name="contrast" value="high" /> High</label>
          </fieldset>

          <fieldset class="customize-group">
            <legend>Motion</legend>
            <label><input type="radio" name="motion" value="full" /> Full</label>
            <label><input type="radio" name="motion" value="reduced" /> Reduced</label>
          </fieldset>
        </div>
      </section>

      <div id="steps-backdrop" class="modal-backdrop" hidden></div>
      <section
        id="steps-modal"
        class="steps-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="steps-title"
        hidden
      >
        <div class="steps-modal__head">
          <h2 id="steps-title">Set up</h2>
          <button id="steps-close" class="steps-close" type="button" aria-label="Close">
            <span aria-hidden="true">&#10005;</span>
          </button>
        </div>
        <p id="steps-count" class="steps-modal__count"></p>
        <div id="steps-body" class="steps-modal__body" aria-live="polite"></div>
        <div class="steps-modal__nav">
          <button id="steps-back" class="steps-nav-btn" type="button">Back</button>
          <button id="steps-next" class="steps-nav-btn steps-nav-btn--primary" type="button">
            Next
          </button>
        </div>
      </section>

      <p id="grid-status" class="visually-hidden" role="status" aria-live="polite"></p>

      <div id="tile-grid" class="tile-grid"></div>

      <details class="activity">
        <summary>Activity &amp; diagnostics</summary>

        <section class="panel" aria-labelledby="scene-heading">
          <h2 id="scene-heading">Screen description</h2>
          <button id="describe-button" class="describe-button" type="button">
            Describe what's on screen
          </button>
          <p id="describe-status" class="describe-status" role="status" aria-live="polite"></p>
        </section>

        <section class="panel" aria-labelledby="overlay-heading">
          <h2 id="overlay-heading">Active overlay layers</h2>
          <ul id="overlay-list" class="overlay-list" aria-live="polite"></ul>
        </section>
      </details>
    </main>

    <!-- Compiled by tsconfig.renderer.json into ../dist-renderer/. -->
    <script type="module" src="../dist-renderer/renderer/renderer.js"></script>
  </body>
</html>

[project]
name = "accessability-hub-python"
version = "0.1.0"
description = "Python-side services for the AccessAbility Hub (vision + audio)."
requires-python = ">=3.11"
# The root project is the Python test harness aggregator; it pulls in the shared
# contracts package (for conftest fixtures) plus every Python package whose module
# is imported by a test, so `uv sync` installs them for the suite.
dependencies = [
  "aah-contracts",
  "aah-host",
  "audio-adapter",
  "camera-adapter",
  "eye-tracking",
  "gaze-correlation",
  "gaze-dwell",
]

# uv workspace: the Python half of the monorepo. Keyed on pyproject.toml so it
# coexists cleanly with the pnpm/turbo TS workspace.
[tool.uv.workspace]
members = [
  "core/contracts/python",
  "core/host/python",
  "services/eye-tracking",
  "services/gaze-correlation",
  "services/gaze-dwell",
  "services/voice-commands",
  "services/hand-signals",
  "adapters/camera",
  "adapters/audio",

]

[tool.uv.sources]
aah-contracts = { workspace = true }
aah-host = { workspace = true }
audio-adapter = { workspace = true }
camera-adapter = { workspace = true }
eye-tracking = { workspace = true }
gaze-correlation = { workspace = true }
gaze-dwell = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "core", "services", "adapters"]
python_files = ["test_*.py", "*_test.py"]
# Make plain `pytest` work without a manual PYTHONPATH: add every Python package
# source root to sys.path so cross-package imports resolve during collection.
pythonpath = [
  "core/contracts/python",
  "core/host/python",
  "services/eye-tracking",
  "services/gaze-correlation",
  "services/gaze-dwell",
  "services/voice-commands",
  "services/hand-signals",
  "adapters/camera",
  "adapters/audio",
]

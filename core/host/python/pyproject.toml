[project]
name = "aah-host"
version = "0.1.0"
description = "Out-of-process host runtime: bridges Python services to the kernel over stdio."
requires-python = ">=3.11"
dependencies = ["aah-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aah_host"]

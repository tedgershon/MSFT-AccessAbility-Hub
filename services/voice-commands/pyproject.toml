[project]
name = "voice-commands"
version = "0.1.0"
description = "Voice command accessibility service (Python + Whisper / Vosk)."
requires-python = ">=3.11"
dependencies = ["aah-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_commands"]

[project]
name = "hand-signals"
version = "0.1.0"
description = "Hand-signal / gesture accessibility service (Python + FastAPI + MediaPipe)."
requires-python = ">=3.11"
dependencies = ["aah-contracts", "fastapi>=0.110"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hand_signals"]

[project]
name = "live-captions"
version = "0.1.0"
description = "Live Captions accessibility service: mic -> speech-to-text -> caption overlay, with translation and non-speech sound alerts (Python)."
requires-python = ">=3.11"
dependencies = ["aah-contracts", "aah-ipc", "audio-adapter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["live_captions"]

[project]
name = "eye-tracking"
version = "0.1.0"
description = "Eye-tracking accessibility service (Python + OpenCV / MediaPipe)."
requires-python = ">=3.11"
dependencies = ["aah-contracts", "aah-host", "numpy>=1.26"]

# Heavy CV stack is opt-in: the base service (bus events) imports neither, so it
# stays light. Install with `pip install -e services/eye-tracking[gaze]` to run the
# iris/gaze estimator and the gaze demo.
[project.optional-dependencies]
gaze = ["mediapipe>=0.10,<0.11", "opencv-python>=4.10"]

[tool.uv.sources]
aah-contracts = { workspace = true }
aah-host = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eye_tracking"]

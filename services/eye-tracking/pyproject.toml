[project]
name = "eye-tracking"
version = "0.1.0"
description = "Eye-tracking accessibility service (Python + OpenCV / MediaPipe)."
requires-python = ">=3.11"
dependencies = ["aah-contracts", "aah-host"]

[tool.uv.sources]
aah-contracts = { workspace = true }
aah-host = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eye_tracking"]

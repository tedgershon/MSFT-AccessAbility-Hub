[project]
name = "conversation-coach"
version = "0.1.0"
description = "Conversation Coach: private real-time conversational repair prompts (autism support) from camera + mic."
requires-python = ">=3.11"
dependencies = ["aah-contracts", "aah-ipc", "camera-adapter", "audio-adapter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conversation_coach"]

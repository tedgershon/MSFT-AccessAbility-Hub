[project]
name = "gaze-dwell"
version = "0.1.0"
description = "Dwell-selection service that converts stable gaze points into input intents."
requires-python = ">=3.11"
dependencies = ["aah-contracts", "aah-host"]

[tool.uv.sources]
aah-contracts = { workspace = true }
aah-host = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaze_dwell"]

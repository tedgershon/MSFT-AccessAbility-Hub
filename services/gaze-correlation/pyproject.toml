[project]
name = "gaze-correlation"
version = "0.1.0"
description = "Correlation service: maps camera/display metadata into gaze events."
requires-python = ">=3.11"
dependencies = ["aah-contracts", "aah-host"]

[tool.uv.sources]
aah-contracts = { workspace = true }
aah-host = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaze_correlation"]
